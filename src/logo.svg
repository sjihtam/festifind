<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Festifind">
  <defs>
    <linearGradient id="fv" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Five bars at uneven heights: a level meter, and a festival skyline.
       No container and no gradient panel — it sits on any background. -->
  <g fill="url(#fv)">
    <rect x="2"  y="17" width="4" height="12" rx="2"/>
    <rect x="8"  y="3"  width="4" height="26" rx="2"/>
    <rect x="14" y="11" width="4" height="18" rx="2"/>
    <rect x="20" y="6"  width="4" height="23" rx="2"/>
    <rect x="26" y="19" width="4" height="10" rx="2"/>
  </g>
</svg>
